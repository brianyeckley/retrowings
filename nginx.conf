server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # text/html is always compressed when gzip is on, so it is not listed here.
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;

    # Health check for Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The game page itself: always revalidate so new versions show up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Three.js only changes when we deliberately upgrade it.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cloudflare sits in front, so trust its forwarded scheme for redirects.
    absolute_redirect off;
}
